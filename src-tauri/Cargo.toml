[package]
name = "daily-weather"
version = "0.1.0"
description = "Offline-friendly daily weather"
edition = "2021"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "daily_weather_lib"
# iOS links the static library into the Xcode app; desktop uses the rlib.
# No cdylib: it is only needed for Android, and on iOS it fails to link
# because the dw_* functions it calls live in the app's Swift code
# (ios/App/SharedContainer.swift) and only exist in the final Xcode link.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Xcode 27 makes swift-rs's runtime symbols (retain_object, release_object,
# string_from_bytes) local, so iOS builds fail with "Undefined symbols".
# This fork is swift-rs 1.0.8 plus a small build-script fix, enabled by
# SWIFT_RS_RUNTIME_ARCHIVE in .cargo/config.toml. Remove both once a swift-rs
# release includes it: https://github.com/Brendonovich/swift-rs/issues/81
[patch.crates-io]
swift-rs = { git = "https://github.com/alchaplinsky/swift-rs", rev = "aaf38d45ab3a4b10a5af3a3dbc64424e998fae8c" }
